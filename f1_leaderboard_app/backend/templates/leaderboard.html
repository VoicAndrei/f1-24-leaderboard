<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Leaderboard</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="body-leaderboard-rotated">
    <div class="container">
        <header>
            <img src="/static/images/Logo + Slogan Gri.svg" alt="Company Logo" id="header-logo">
            <h1>Leaderboard: <span id="track-name">Loading...</span></h1>
        </header>

        <section id="info-bar">
            <div id="age-requirement">VÂRSTA MINIMĂ: <strong>12 ANI</strong></div>
            <div id="rig-status">
                <span class="rig-status-label">SIMULATOARE</span>
                <ul id="rig-status-list">
                    <li class="rig-status-loading">Se încarcă...</li>
                </ul>
            </div>
        </section>

        <main>
            <table id="leaderboard-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Player Name</th>
                        <th>Lap Time</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- Leaderboard data will be inserted here by JavaScript -->
                </tbody>
            </table>
        </main>

        <footer>
            <div id="qr-cta">
                <img src="/static/images/qr-instagram.png" alt="Instagram QR" id="qr-image">
                <div id="qr-text">
                    <p class="qr-headline">Scanează codul și urmărește-ne pe Instagram</p>
                    <p class="qr-sub">apoi urcă-te la simulator pentru 6 minute de adrenalină!</p>
                </div>
            </div>
            <p class="copyright">Landgame &copy; 2026</p>
        </footer>
    </div>

    <script src="/static/js/leaderboard.js"></script>
</body>
</html>
